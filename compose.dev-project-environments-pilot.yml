# Append to the COMPLETE existing Compose list. Only promote idle, certified
# candidates; keep all runtime/Python/experiment/SSO/audit volumes and settings.
# General Python resolver, NOT a GEM catalog. No host ports or runtime secrets
# are exposed to either new service. Generate a dedicated secret before use.
services:
  mcp-server:
    image: argus-core-project-resolver:20260928
    environment:
      ARGUS_PROJECT_ENVIRONMENTS_ENABLED: "true"
  argus-dev:
    image: argus-dev-project-resolver:20260928
    environment:
      ARGUS_PROJECT_ENVIRONMENTS_ENABLED: "true"
  agent-workspace:
    image: argus-workspace-project-resolver:20260928
    environment:
      ARGUS_PROJECT_ENVIRONMENTS_ENABLED: "true"
      ARGUS_PROJECT_ENVIRONMENTS_MODE: python-public-wheels-v1
    networks:
      - default
      - environment-control
    secrets:
      - environment_resolver
    volumes:
      - project-environment-tools-20260928:/opt/argus-environment-tools:ro
  environment-resolver:
    image: argus-environment-resolver:20260928
    build:
      context: ./project-environments
      target: resolver
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8092,timeout=3); c.request('GET','/healthz'); assert c.getresponse().status == 403"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    networks: [environment-control, environment-download]
    secrets: [environment_resolver]
    volumes:
      - project-environment-downloads:/cache
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=384m,noexec,nosuid,nodev
    depends_on: [environment-egress]
  environment-egress:
    image: argus-environment-egress:20260928
    build:
      context: ./project-environments
      target: egress
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',3128,timeout=3); c.request('CONNECT','denied.invalid:443'); assert c.getresponse().status == 403"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
    networks: [environment-download, environment-public]
volumes:
  project-environment-downloads:
  project-environment-tools-20260928:
networks:
  environment-control:
    internal: true
  environment-download:
    internal: true
  environment-public:
secrets:
  environment_resolver:
    file: ${ARGUS_ENVIRONMENT_RESOLVER_SECRET_FILE:-./secrets/project-environments/resolver.key}
