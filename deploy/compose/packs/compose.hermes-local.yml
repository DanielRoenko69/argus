# Optional provider-neutral Hermes upstream for local development.
#
# This service deliberately has no dependency on LiteLLM and receives no Argus
# LLM credential. Its provider, model and OAuth/API credentials live only in
# the persistent Hermes profile under /opt/data. Existing Hermes installations
# can omit this overlay and set HERMES_BASE_URL instead.

services:
  argus-hermes:
    depends_on:
      hermes-upstream:
        condition: service_healthy

  hermes-upstream:
    image: ${HERMES_UPSTREAM_IMAGE:-nousresearch/hermes-agent:v2026.7.7.2}
    ports:
      - "127.0.0.1:${HERMES_UPSTREAM_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_CORS_ORIGINS: ${HERMES_API_SERVER_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      API_SERVER_MODEL_NAME: ${HERMES_UPSTREAM_MODEL_NAME:-hermes-agent}
    # Hermes' S6 service manager deliberately rebuilds the service environment.
    # Materialize only this service key into Hermes' own persistent 0600 .env;
    # it remains absent from Compose interpolation and container metadata.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -c "from pathlib import Path; p=Path('/opt/data/.env'); k=Path('/run/secrets/argus-hermes-api-key').read_text().strip(); lines=p.read_text().splitlines() if p.exists() else []; lines=[x for x in lines if not x.startswith('API_SERVER_KEY=')]; p.write_text('\n'.join(lines + ['API_SERVER_KEY=' + k]) + '\n'); p.chmod(0o600)"
        exec /init /opt/hermes/docker/main-wrapper.sh gateway run
    secrets:
      - source: argus-hermes-api-key
        target: argus-hermes-api-key
        mode: 0444
    volumes:
      - hermes-upstream-data:/opt/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  hermes-upstream-data:
