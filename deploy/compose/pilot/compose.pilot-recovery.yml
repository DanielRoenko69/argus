services:
  pilot-source-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: argus_source
      POSTGRES_USER: argus_recovery
      POSTGRES_PASSWORD: argus_recovery_local_only
    ports:
      - "127.0.0.1:${ARGUS_PILOT_SOURCE_DB_PORT:-55439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_recovery -d argus_source"]
      interval: 2s
      timeout: 3s
      retries: 30

  pilot-restore-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: argus_restore
      POSTGRES_USER: argus_recovery
      POSTGRES_PASSWORD: argus_recovery_local_only
    ports:
      - "127.0.0.1:${ARGUS_PILOT_RESTORE_DB_PORT:-55440}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_recovery -d argus_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
