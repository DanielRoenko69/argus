# Docker-only installer secret transport. The disposable installer streams the
# local files into this named volume without placing their values in container
# metadata. Separate volumes preserve least-privilege visibility; the overlay
# adjusts each service's file path to its private read-only mount.

services:
  mcp-server:
    secrets: !override []
    environment:
      ARGUS_SOLUTION_PACK_TOKEN_FILES: argus.hermes=/run/secrets/hermes-discovery/argus-hermes-discovery-token
    volumes:
      - argus-installer-hermes-discovery:/run/secrets/hermes-discovery:ro

  argus-hermes:
    secrets: !override []
    environment:
      ARGUS_PACK_DISCOVERY_TOKEN_FILE: /run/secrets/hermes-discovery/argus-hermes-discovery-token
      HERMES_API_KEY_FILE: /run/secrets/hermes-api/argus-hermes-api-key
    volumes:
      - argus-installer-hermes-discovery:/run/secrets/hermes-discovery:ro
      - argus-installer-hermes-api:/run/secrets/hermes-api:ro

  hermes-upstream:
    secrets: !override []
    volumes:
      - argus-installer-hermes-api:/run/secrets:ro

volumes:
  argus-installer-hermes-discovery:
    external: true
    name: ${ARGUS_COMPOSE_PROJECT:-argus-core}-installer-hermes-discovery
  argus-installer-hermes-api:
    external: true
    name: ${ARGUS_COMPOSE_PROJECT:-argus-core}-installer-hermes-api
