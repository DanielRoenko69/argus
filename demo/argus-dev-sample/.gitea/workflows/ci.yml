name: verify-service

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate production build
        run: npm run build
      - name: Publish summary
        if: always()
        run: |
          echo "## Argus.Dev sample verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests and production syntax validation completed." >> "$GITHUB_STEP_SUMMARY"
