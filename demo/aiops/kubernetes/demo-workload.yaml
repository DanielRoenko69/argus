apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: argus-shop
  annotations:
    argus.aiops/dependencies: catalog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      annotations:
        argus.aiops/demo-revision: baseline-v2
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: argus-shop
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: argus-shop
spec:
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: argus-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/part-of: argus-shop
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: argus-shop
spec:
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: http
