apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: payment-worker
    app.kubernetes.io/part-of: argus-shop
  annotations:
    argus.aiops/incident: simulated-startup-failure
    argus.aiops/dependencies: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-worker
        app.kubernetes.io/part-of: argus-shop
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
            - echo 'simulated payment dependency failure' >&2; sleep 8; exit 1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
