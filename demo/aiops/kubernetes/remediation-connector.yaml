apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-kubernetes-remediation
  namespace: argus-aiops-system
  labels:
    app.kubernetes.io/name: argus-kubernetes-remediation
    app.kubernetes.io/part-of: argus-aiops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-kubernetes-remediation
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: argus-kubernetes-remediation
    app.kubernetes.io/part-of: argus-aiops
rules:
  # Scale stays confined to scale subresources. Revision restoration additionally
  # needs read-only ReplicaSet history plus JSON-patch on one namespaced Deployment;
  # the connector itself enforces the explicit workload allowlist and fingerprints.
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - patch
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-kubernetes-remediation
  namespace: argus-demo
  labels:
    app.kubernetes.io/name: argus-kubernetes-remediation
    app.kubernetes.io/part-of: argus-aiops
subjects:
  - kind: ServiceAccount
    name: argus-kubernetes-remediation
    namespace: argus-aiops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-kubernetes-remediation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-kubernetes-remediation
  namespace: argus-aiops-system
  labels:
    app.kubernetes.io/name: argus-kubernetes-remediation
    app.kubernetes.io/part-of: argus-aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-kubernetes-remediation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-kubernetes-remediation
        app.kubernetes.io/part-of: argus-aiops
    spec:
      serviceAccountName: argus-kubernetes-remediation
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argus-remediation-connector
          image: argus-aiops-remediation-connector:local
          imagePullPolicy: Never
          env:
            - name: EXECUTION_NAMESPACES
              value: argus-demo
            - name: EXECUTION_WORKLOADS
              value: checkout-api
          ports:
            - name: mcp
              containerPort: 8085
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: argus-kubernetes-remediation
  namespace: argus-aiops-system
  labels:
    app.kubernetes.io/name: argus-kubernetes-remediation
    app.kubernetes.io/part-of: argus-aiops
spec:
  # This NodePort is reachable only on the private Kind Docker network. It has
  # no host extraPortMapping and is not published on the Windows interface.
  type: NodePort
  selector:
    app.kubernetes.io/name: argus-kubernetes-remediation
  ports:
    - name: mcp
      port: 8085
      targetPort: mcp
      nodePort: 30085
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-kubernetes-remediation-ingress
  namespace: argus-aiops-system
  labels:
    app.kubernetes.io/name: argus-kubernetes-remediation
    app.kubernetes.io/part-of: argus-aiops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus-kubernetes-remediation
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8085
