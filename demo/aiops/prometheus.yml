global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: argus-core
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/argus/metrics-token
    static_configs:
      - targets:
          - mcp-server:3000
        labels:
          environment: local-demo
          service: argus-core

  - job_name: checkout-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - aiops-checkout-metrics:9464
        labels:
          environment: argus-demo
          service: checkout-api

  # This target is created only by the dedicated local Showcase walkthrough.
  # Its absence is expected outside that profile and must never be interpreted
  # as telemetry from the public upstream GEM project.
  - job_name: demo-gem-showcase
    metrics_path: /metrics
    static_configs:
      - targets:
          - demo-gem-showcase:8080
        labels:
          environment: demo-local-demo
          service: demo-gem-showcase
          synthetic: "true"
