# ============================================================
# OpenTelemetry Collector Configuration
# ============================================================
# Receives traces/metrics/logs from instrumented apps
# and exports them to SigNoz (via OTLP)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus metrics scraper (optional - scrape from MCP server /metrics)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'argus-core'
          scrape_interval: 15s
          static_configs:
            - targets: ['host.docker.internal:3000']  # MCP server /metrics endpoint

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Add resource attributes
  resource:
    attributes:
      - key: service.name
        value: argus-core
        action: upsert
      - key: deployment.environment
        value: development
        action: upsert

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Export to SigNoz
  otlp:
    endpoint: signoz:4317
    tls:
      insecure: true

  # Debug exporter for local testing (logs to stdout)
  logging:
    loglevel: info

  # Prometheus exporter for scraping by Prometheus/Grafana
  prometheus:
    endpoint: "0.0.0.0:8889"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp, logging, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp, logging]
